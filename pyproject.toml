[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnaitor"
# This project was previously published/developed under the name "genaitor",
# but that name on PyPI is owned by a different, unrelated account/org
# (a 403 confirmed this session that we cannot upload to it). Rather than
# fight over the old name, the project has been renamed to "pinnaitor"
# (brand: PinnAItor) as a fresh identity, so the version resets to 0.1.0
# rather than continuing the old genaitor 1.0.x lineage.
version = "0.1.0"
description = "A platform for AI Agents and AI Agents products generation."
authors = [{ name = "Yan Barros", email = "yanbarrosyan@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "transformers>=4.30.0",
    "pdfplumber>=0.11.6",
    "python-pptx==1.0.2",
    "python-docx>=1.1.2",
    "pandas>=2.2.3",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "moviepy>=2.1.2",
    "SpeechRecognition>=3.14.2",
    "pydub>=0.25.1",
    "langchain>=0.0.300",
    "langchain-community>=0.0.10",
    "requests>=2.32.3",
    "absl-py>=2.1.0",
    "grpcio>=1.50.0",
    "matplotlib>=3.5.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.40",
    "PyPDF2>=3.0.1",
    "torch>=2.2.1",
    "datasets>=3.3.2",
    "trl>=0.16.1",
    "peft>=0.15.1",
    "rasterio>=1.4.3",
    "bs4>=0.0.2",
    "google-genai>=1.11.0",
    "google-generativeai>=0.8.4",
    "streamlit>=1.44.0",
    "tifffile>=2025.3.13",
    "opencv-python>=4.11.0.86",
    "ezdxf>=1.4.0",
    "numpy>=1.26.4",
    "h5py>=3.13.0",
    "netCDF4>=1.7.2",
    "astropy>=7.0.1",
    "astropy-iers-data>=0.2025.3.31.0.36.18",
    "trimesh>=4.6.4",
    "avro>=1.12.0",
    "scipy>=1.15.2",
    "aiohttp>=3.11.13",
    "fastapi>=0.115.11",
    "tiktoken>=0.9.0",
    "openai>=1.66.3",
    "anthropic>=0.49.0",
    "colorama>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/PINNeAPPle-Labs/pinnaitor"
Repository = "https://github.com/PINNeAPPle-Labs/pinnaitor"
Issues = "https://github.com/PINNeAPPle-Labs/pinnaitor/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
# `where = ["."]` + `include = ["pinnaitor*"]` discovers "pinnaitor" itself
# (and its pinnaitor.core / pinnaitor.llm / pinnaitor.presets /
# pinnaitor.utils submodules) as the actual package tree. (A prior config
# that read `where = ["genaitor"]` looked *inside* that directory instead
# and never included the top-level package at all -- fixed earlier this
# session, and carried forward correctly here under the new name.)
where = ["."]
include = ["pinnaitor*"]
